name: LauncherBoard
options:
  bundleIdPrefix: com.hmatt1
  developmentLanguage: en
  deploymentTarget:
    iOS: "27.0"
targets:
  LauncherBoard:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources: [App, Shared]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.hmatt1.shortcutlauncherwidget
      DEVELOPMENT_TEAM: FHMS65N3XS
      CODE_SIGN_STYLE: Automatic
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      TARGETED_DEVICE_FAMILY: "1,2"
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      SWIFT_VERSION: "5.0"
      MARKETING_VERSION: "3.4.4"
      CURRENT_PROJECT_VERSION: "21"
      CODE_SIGN_ENTITLEMENTS: App/LauncherBoard.entitlements
    configs:
      # Manual, not Automatic: Automatic signing was minting a fresh
      # Development certificate on every CI run (its private key can't
      # survive past that ephemeral runner, so it's dead the moment the job
      # ends) until Apple's per-account cap got hit. This points at one
      # fixed certificate + profile instead, created once by
      # Tools/setup-signing.py and never regenerated. Debug (Xcode's
      # default local-development config, left off this list) stays
      # Automatic, for anyone building to their own device from Xcode.
      Release:
        CODE_SIGN_IDENTITY: "Apple Distribution"
        CODE_SIGN_STYLE: Manual
        PROVISIONING_PROFILE_SPECIFIER: "Shortcut Launcher Widget App Store"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Shortcut Launcher Widget
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        # This app has no network access at all, so it uses no encryption
        # beyond what the OS itself provides. Without this key, App Store
        # Connect asks the export-compliance question by hand on every
        # single build and holds each one in "Missing Compliance" until
        # answered; with it set to false, that question resolves itself.
        ITSAppUsesNonExemptEncryption: false
        # Required once TARGETED_DEVICE_FAMILY includes iPad (2) - App Store
        # Connect rejects an upload with no orientations declared, since an
        # iPad app must support multitasking. Omitted for the Widget
        # extension target below: it has no window of its own, so the
        # requirement doesn't apply there.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: LauncherBoardWidget
        embed: true
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework

  LauncherBoardWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "27.0"
    sources: [Widget, Shared]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.hmatt1.shortcutlauncherwidget.Widget
      DEVELOPMENT_TEAM: FHMS65N3XS
      CODE_SIGN_STYLE: Automatic
      SKIP_INSTALL: "YES"
      TARGETED_DEVICE_FAMILY: "1,2"
      SWIFT_VERSION: "5.0"
      MARKETING_VERSION: "3.4.4"
      CURRENT_PROJECT_VERSION: "21"
      CODE_SIGN_ENTITLEMENTS: Widget/LauncherBoardWidget.entitlements
    configs:
      Release:
        CODE_SIGN_IDENTITY: "Apple Distribution"
        CODE_SIGN_STYLE: Manual
        PROVISIONING_PROFILE_SPECIFIER: "Shortcut Launcher Widget Extension App Store"
    info:
      path: Widget/Info.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CFBundleDisplayName: Shortcut Launcher Widget
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
