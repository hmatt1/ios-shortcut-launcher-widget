name: LauncherBoard
options:
  bundleIdPrefix: com.hmatt1
  developmentLanguage: en
  deploymentTarget:
    iOS: "27.0"
targets:
  LauncherBoard:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hmatt1.shortcutlauncherwidget
        DEVELOPMENT_TEAM: FHMS65N3XS
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "3.4.4"
        CURRENT_PROJECT_VERSION: "21"
        CODE_SIGN_ENTITLEMENTS: App/LauncherBoard.entitlements
      # configs: must live INSIDE settings (target.settings.configs.Release),
      # not as a sibling key of settings at the target level. That was the
      # actual, longstanding bug behind every Release-only override never
      # taking effect during `xcodebuild archive` - true even before this
      # session touched any of it (CODE_SIGN_IDENTITY: "Apple Distribution"
      # was already here, silently ignored, well before the certificate-cap
      # investigation started). See XcodeGen's ProjectSpec.md "Settings".
      configs:
        Release:
          # Manual, not Automatic: Automatic signing was minting a fresh
          # Development certificate on every CI run (its private key can't
          # survive past that ephemeral runner, so it's dead the moment the
          # job ends) until Apple's per-account cap got hit. This points at
          # one fixed certificate + profile instead, created once by
          # Tools/setup-signing.py and never regenerated. Debug (Xcode's
          # default local-development config) stays Automatic, for anyone
          # building to their own device from Xcode.
          CODE_SIGN_IDENTITY: "Apple Distribution"
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: "Shortcut Launcher Widget App Store"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Shortcut Launcher Widget
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        # This app has no network access at all, so it uses no encryption
        # beyond what the OS itself provides. Without this key, App Store
        # Connect asks the export-compliance question by hand on every
        # single build and holds each one in "Missing Compliance" until
        # answered; with it set to false, that question resolves itself.
        ITSAppUsesNonExemptEncryption: false
        # Required once TARGETED_DEVICE_FAMILY includes iPad (2) - App Store
        # Connect rejects an upload with no orientations declared, since an
        # iPad app must support multitasking. Omitted for the Widget
        # extension target below: it has no window of its own, so the
        # requirement doesn't apply there.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: LauncherBoardWidget
        embed: true
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
      # Needed since Shared/LauncherIntent.swift and
      # Shared/LauncherWidgetView.swift (compiled into this target too -
      # see their header comments) import AppIntents, not because the app
      # itself uses App Intents directly.
      - sdk: AppIntents.framework
    # Attaches WidgetScreenshotsUITests to this target's own auto-generated
    # scheme's Test action, via XcodeGen's per-target `scheme.testTargets`
    # convenience - the only thing it changes is adding a Test action entry,
    # so it can't touch the Build/Archive actions the signing pipeline
    # depends on. Deliberately not a top-level `schemes:` block: that would
    # replace the whole auto-generated scheme by hand, risking exactly the
    # kind of silent misconfiguration the `configs:` nesting bug earlier
    # taught this project to be wary of.
    scheme:
      testTargets:
        - WidgetScreenshotsUITests
        - WidgetLogicTests
        - WidgetMemoryCheckUITests

  LauncherBoardWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "27.0"
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hmatt1.shortcutlauncherwidget.Widget
        DEVELOPMENT_TEAM: FHMS65N3XS
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "3.4.4"
        CURRENT_PROJECT_VERSION: "21"
        CODE_SIGN_ENTITLEMENTS: Widget/LauncherBoardWidget.entitlements
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Apple Distribution"
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: "Shortcut Launcher Widget Extension App Store"
    info:
      path: Widget/Info.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CFBundleDisplayName: Shortcut Launcher Widget
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework

  # Drives the app in the Simulator (via Tools/organize-screenshots.py +
  # .github/workflows/screenshots.yml) to capture App Store screenshots of
  # the in-app live preview - which renders through the exact same
  # BoardGrid/BoardView/SlotFace pipeline as the real widget (see Shared/).
  # Simulator-only: never archived, so it needs none of the Manual/Release
  # signing the app and widget targets carry.
  WidgetScreenshotsUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "27.0"
    sources: [WidgetScreenshots]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hmatt1.shortcutlauncherwidget.ScreenshotsUITests
        DEVELOPMENT_TEAM: FHMS65N3XS
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        # No Info.plist checked in for this target (it's just two Swift
        # files) - XcodeGen only wires up INFOPLIST_FILE when it finds one
        # among a target's sources, so without this the .xctest bundle
        # would end up with no Info.plist at all.
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: LauncherBoard

  # Fast, host-less unit tests of the widget's actual logic - BoardGrid math,
  # theme contrast, the widget's timeline provider, and the exact
  # WidgetFamily -> BoardSize mapping that caused the XL widget crash. Runs
  # on every push via .github/workflows/build.yml (unlike the two Simulator-
  # UI-driving targets above, which are slow and either manual or on-demand).
  # No sources of its own beyond the test files themselves.
  #
  # Depends on LauncherBoard (the app target), NOT LauncherBoardWidget - a
  # first attempt at depending directly on the extension target compiled and
  # type-checked fine but failed at LINK time on real CI ("Undefined
  # symbols... Ld .../WidgetLogicTests ... (in target 'WidgetLogicTests')"):
  # an app-extension's compiled .appex isn't a linkable library the way an
  # .application is, so a host-less unit-test target can't pull symbols out
  # of one. That's exactly why LauncherEntry/LauncherProvider/
  # BoardSize(family:)/LauncherWidgetView and LauncherIntent live in Shared/
  # now instead of Widget/ (see Shared/LauncherWidgetView.swift's header
  # comment) - LauncherBoard's sources already include Shared/, so
  # `@testable import LauncherBoard` reaches all of it, and .application is
  # the standard, fully-supported host type for a hostless XCTest target.
  # Widget/Widget.swift keeps only its @main registration.
  WidgetLogicTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "27.0"
    sources: [WidgetLogicTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hmatt1.shortcutlauncherwidget.LogicTests
        DEVELOPMENT_TEAM: FHMS65N3XS
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: LauncherBoard

  # Phase A of a real .appex memory-footprint check (see
  # .github/workflows/widget-memory-check.yml): SpringBoard automation this
  # project has no prior grounding in, on iOS 27 specifically. Stops at
  # entering jiggle mode and dumping diagnostics rather than guessing past
  # it - see WidgetMemoryCheck/EnterJiggleModeTests.swift's own header
  # comment. Simulator-only, same as WidgetScreenshotsUITests above.
  WidgetMemoryCheckUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "27.0"
    sources: [WidgetMemoryCheck]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hmatt1.shortcutlauncherwidget.MemoryCheckUITests
        DEVELOPMENT_TEAM: FHMS65N3XS
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: LauncherBoard
