name: LauncherBoard
options:
  bundleIdPrefix: com.hmatt1
  developmentLanguage: en
  deploymentTarget:
    iOS: "27.0"
targets:
  LauncherBoard:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources: [App, Shared]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.hmatt1.shortcutlauncherwidget
      DEVELOPMENT_TEAM: FHMS65N3XS
      CODE_SIGN_STYLE: Automatic
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      TARGETED_DEVICE_FAMILY: "1"
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      SWIFT_VERSION: "5.0"
      MARKETING_VERSION: "3.4.4"
      CURRENT_PROJECT_VERSION: "21"
      CODE_SIGN_ENTITLEMENTS: App/LauncherBoard.entitlements
    configs:
      Release:
        CODE_SIGN_IDENTITY: "Apple Distribution"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Launcher Board
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
    dependencies:
      - target: LauncherBoardWidget
        embed: true
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework

  LauncherBoardWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "27.0"
    sources: [Widget, Shared]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.hmatt1.shortcutlauncherwidget.Widget
      DEVELOPMENT_TEAM: FHMS65N3XS
      CODE_SIGN_STYLE: Automatic
      SKIP_INSTALL: "YES"
      TARGETED_DEVICE_FAMILY: "1"
      SWIFT_VERSION: "5.0"
      MARKETING_VERSION: "3.4.4"
      CURRENT_PROJECT_VERSION: "21"
      CODE_SIGN_ENTITLEMENTS: Widget/LauncherBoardWidget.entitlements
    configs:
      Release:
        CODE_SIGN_IDENTITY: "Apple Distribution"
    info:
      path: Widget/Info.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CFBundleDisplayName: Launcher Board
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
