name: iOS Build

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: xcode-27
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install xcodegen ldid

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Import signing certificate and profiles
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROFILE_APP_BASE64: ${{ secrets.IOS_PROFILE_APP_BASE64 }}
          IOS_PROFILE_WIDGET_BASE64: ${{ secrets.IOS_PROFILE_WIDGET_BASE64 }}
        run: |
          # One fixed Distribution certificate + two App Store profiles
          # (created once by Tools/setup-signing.py), imported fresh into
          # this runner's own temporary keychain every run. Replaces
          # CODE_SIGN_STYLE: Automatic, which asked Apple to mint a brand
          # new Development certificate on every run - its private key
          # can't survive past this ephemeral VM, so it was permanently
          # dead the moment the job ended, and enough of those exhausted
          # the account's certificate cap.
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          # Save whatever this runner's keychain state already was, so the
          # cleanup step at the end of the job can put it back exactly as
          # found - runs-on: xcode-27 is this project's own custom runner
          # label, not a guaranteed-fresh stock GitHub-hosted image, so
          # this can't assume the machine is thrown away after this job.
          echo "PRIOR_DEFAULT_KEYCHAIN=$(security default-keychain | sed 's/^ *"\(.*\)"$/\1/')" >> "$GITHUB_ENV"
          echo "PRIOR_KEYCHAIN_SEARCH_LIST=$(security list-keychains -d user | sed 's/"//g' | tr '\n' ' ')" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/distribution.p12"
          # openssl, not `base64 --decode`: macOS ships BSD base64, whose
          # decode flag is `-D` (uppercase) - the GNU/Linux `--decode` long
          # option it doesn't recognize. openssl's `base64 -d` is identical
          # on both, so this can't silently break on whichever OS runs it.
          echo "$IOS_DIST_CERT_P12_BASE64" | openssl base64 -d -A > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security default-keychain -s "$KEYCHAIN_PATH"

          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"

          install_profile() {
            local b64="$1"
            local tmp_profile="$RUNNER_TEMP/profile.mobileprovision"
            echo "$b64" | openssl base64 -d -A > "$tmp_profile"
            local uuid
            # A here-string, not a plain pipe: PlistBuddy reading /dev/stdin
            # from a live pipe is a documented-flaky pattern; fully
            # buffering the decoded plist first is the reliable form.
            uuid=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$(security cms -D -i "$tmp_profile")")
            cp "$tmp_profile" "$PROFILES_DIR/$uuid.mobileprovision"
            echo "Installed profile $uuid"
          }

          install_profile "$IOS_PROFILE_APP_BASE64"
          install_profile "$IOS_PROFILE_WIDGET_BASE64"

          # TEMPORARY diagnostic - remove once "No profiles ... found" is
          # root-caused. Confirms what's actually installed/available
          # rather than guessing further from the error text alone.
          echo "DEBUG: codesigning identities in keychain:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
          echo "DEBUG: installed profiles:"
          for f in "$PROFILES_DIR"/*.mobileprovision; do
            echo "  -- $f --"
            security cms -D -i "$f" | /usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin
            security cms -D -i "$f" | /usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /dev/stdin
            security cms -D -i "$f" | /usr/libexec/PlistBuddy -c "Print :ExpirationDate" /dev/stdin
          done

      - name: Build and Upload to TestFlight
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.ADMIN_APPSTORE_KEY_ID }}
          APPSTORE_P8_KEY: ${{ secrets.ADMIN_APPSTORE_P8_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+)*$' || VERSION="0.0.0"

          # 1. Setup App Store Connect API Key for altool (and fix Windows line endings!)
          mkdir -p ~/.appstoreconnect/private_keys/
          echo "$APPSTORE_P8_KEY" | tr -d '\r' > ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8

          # 2. Archive the app - manual signing (see project.yml's Release
          # config and the "Import signing certificate" step above), so no
          # provisioning-update flags or API auth needed here anymore.
          # -configuration Release, explicitly: without it, this was
          # archiving Debug (still CODE_SIGN_STYLE: Automatic, still asking
          # for a Development profile) rather than Release (Manual signing,
          # the fixed Distribution certificate/profiles) - relying on the
          # scheme's own default archive configuration silently picked the
          # wrong one.
          xcodebuild clean archive \
            -project LauncherBoard.xcodeproj \
            -scheme LauncherBoard \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath LauncherBoard.xcarchive \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

          # 3. Create ExportOptions.plist - manual signing, pointing at the
          # exact same fixed certificate and profiles as project.yml.
          cat <<EOF > exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>manageAppVersionAndBuildNumber</key>
              <true/>
              <key>uploadSymbols</key>
              <true/>
              <key>teamID</key>
              <string>FHMS65N3XS</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.hmatt1.shortcutlauncherwidget</key>
                  <string>Shortcut Launcher Widget App Store</string>
                  <key>com.hmatt1.shortcutlauncherwidget.Widget</key>
                  <string>Shortcut Launcher Widget Extension App Store</string>
              </dict>
          </dict>
          </plist>
          EOF

          # 4. Export the IPA - manual signing, no Apple auth needed.
          xcodebuild -exportArchive \
            -archivePath LauncherBoard.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath export

          # 5. Upload to TestFlight - this is the one step that still
          # needs the App Store Connect API key, purely to authenticate
          # the upload itself.
          xcrun altool --upload-app \
            -f export/LauncherBoard.ipa \
            -t ios \
            --apiKey $APPSTORE_KEY_ID \
            --apiIssuer $APPSTORE_ISSUER_ID

      - name: Remove signing keychain
        if: always()
        run: |
          # Restore the runner's own prior keychain state before deleting
          # the temporary one - see the comment in "Import signing
          # certificate and profiles" on why this can't assume a fresh VM.
          if [ -n "$PRIOR_KEYCHAIN_SEARCH_LIST" ]; then
            security list-keychains -d user -s $PRIOR_KEYCHAIN_SEARCH_LIST || true
          fi
          if [ -n "$PRIOR_DEFAULT_KEYCHAIN" ]; then
            security default-keychain -s "$PRIOR_DEFAULT_KEYCHAIN" || true
          fi
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: LauncherBoard-IPA
          path: export/LauncherBoard.ipa

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: export/LauncherBoard.ipa
