name: List Certificates

# Diagnostic + cleanup tool for the Apple Developer account's code-signing
# certificates, via the App Store Connect API. Manually triggered only.
#
# CODE_SIGN_STYLE: Automatic mints a new development certificate on every
# fresh CI runner that can't find one cached, and Apple caps how many can
# exist at once - this is what "Choose a certificate to revoke" in the main
# build means. Leave revoke_ids blank to only list what's on the account
# (read-only, GET); pass a comma-separated list of certificate IDs (from a
# prior list run) to revoke (DELETE) exactly those and nothing else.

on:
  workflow_dispatch:
    inputs:
      revoke_ids:
        description: 'Comma-separated certificate IDs to revoke. Leave blank to only list.'
        required: false
        default: ''

jobs:
  list:
    name: List / revoke certificates
    runs-on: xcode-27
    steps:
      - name: List and optionally revoke certificates via App Store Connect API
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.ADMIN_APPSTORE_KEY_ID }}
          APPSTORE_P8_KEY: ${{ secrets.ADMIN_APPSTORE_P8_KEY }}
          REVOKE_IDS: ${{ inputs.revoke_ids }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys/
          echo "$APPSTORE_P8_KEY" | tr -d '\r' > ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8
          pip3 install --quiet --break-system-packages pyjwt cryptography

          python3 - <<'PYEOF'
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          import jwt

          key_id = os.environ["APPSTORE_KEY_ID"]
          issuer_id = os.environ["APPSTORE_ISSUER_ID"]
          key_path = os.path.expanduser(f"~/.appstoreconnect/private_keys/AuthKey_{key_id}.p8")
          with open(key_path) as f:
              private_key = f.read()

          now = int(time.time())
          payload = {"iss": issuer_id, "iat": now, "exp": now + 19 * 60, "aud": "appstoreconnect-v1"}
          token = jwt.encode(payload, private_key, algorithm="ES256", headers={"kid": key_id, "typ": "JWT"})

          def api(method, path):
              req = urllib.request.Request(
                  f"https://api.appstoreconnect.apple.com/v1{path}",
                  headers={"Authorization": f"Bearer {token}"},
                  method=method,
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      raw = resp.read()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  print(f"  ERROR {method} {path} -> {e.code}: {e.read().decode(errors='replace')}")
                  return None

          data = api("GET", "/certificates?limit=200")
          certs = data.get("data", []) if data else []
          print(f"{len(certs)} certificate(s) on this account:\n")
          now_iso = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
          for c in certs:
              a = c["attributes"]
              expired = (a.get("expirationDate") or "9999") < now_iso
              print(f"id={c['id']}")
              print(f"  type={a.get('certificateType')}  platform={a.get('platform')}")
              print(f"  name={a.get('name')!r}  displayName={a.get('displayName')!r}")
              print(f"  serialNumber={a.get('serialNumber')}  activated={a.get('activated')}")
              print(f"  expirationDate={a.get('expirationDate')}  EXPIRED={expired}")
              print(f"  raw_attributes={a}")
              print()

          revoke_ids = [i.strip() for i in os.environ.get("REVOKE_IDS", "").split(",") if i.strip()]
          if revoke_ids:
              print(f"--- Revoking {len(revoke_ids)} certificate(s) ---\n")
              for cid in revoke_ids:
                  print(f"DELETE /certificates/{cid}")
                  result = api("DELETE", f"/certificates/{cid}")
                  print("  revoked" if result is not None else "  FAILED")
          else:
              print("(no revoke_ids given - listed only)")
          PYEOF
